<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAAN | Admin Command Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f0f13; --surface: #1c1c24; --gold: #d4af37; --text-main: #f5f5f7; --text-muted: #a0a0a5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid rgba(255,215,0,0.2); text-align: center; width: 350px; }
        .auth-box input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 6px; }
        .auth-box button { width: 100%; padding: 12px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,215,0,0.1); }
        .sidebar h2 { color: var(--gold); margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; text-align: center; }
        .nav-btn { background: transparent; color: var(--text-muted); border: none; padding: 15px; text-align: left; font-size: 1rem; cursor: pointer; border-radius: 8px; transition: 0.2s; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        .nav-btn:hover, .nav-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); }
        
        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card h4 { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .value { font-size: 1.8rem; color: var(--gold); font-weight: 600; }

        /* Panels & Tables */
        .panel { display: none; }
        .panel.active { display: block; }
        .data-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-table th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; background: rgba(0,0,0,0.2); }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background: rgba(255, 165, 0, 0.2); color: orange; }
        .badge-completed { background: rgba(0, 255, 0, 0.2); color: #4ade80; }

        /* Form */
        .add-form { background: var(--surface); padding: 20px; border-radius: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .add-form input { background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 6px; width: 100%; }
        button.action-btn { background: var(--gold); color: black; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; grid-column: span 2; }
        button.del-btn { background: rgba(255,0,0,0.2); color: #ff4d4d; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="color:var(--gold); margin-bottom:20px;">SHAAN ADMIN</h2>
            <input type="text" id="login-user" placeholder="Username">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="login()">Enter Command Center</button>
        </div>
    </div>

    <aside class="sidebar">
        <h2>SHAAN <br><span style="font-size:0.8rem; color:var(--text-muted)">ADMIN</span></h2>
        <button class="nav-btn active" onclick="switchTab('orders')"><i class="fas fa-box"></i> Live Orders</button>
        <button class="nav-btn" onclick="switchTab('products')"><i class="fas fa-spray-can"></i> Inventory</button>
        <button class="nav-btn" onclick="logout()" style="margin-top:auto;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 id="page-title">Dashboard Overview</h1>
            <div class="user-profile"><i class="fas fa-user-circle fa-2x" style="color:var(--gold)"></i></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h4>Total Revenue</h4><div class="value" id="stat-rev">₹0</div></div>
            <div class="stat-card"><h4>Pending Orders</h4><div class="value" id="stat-orders">0</div></div>
            <div class="stat-card"><h4>Products Listed</h4><div class="value" id="stat-prods">0</div></div>
        </div>

        <section id="orders" class="panel active">
            <table class="data-table">
                <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="orders-list"></tbody>
            </table>
        </section>

        <section id="products" class="panel">
            <div class="add-form">
                <input id="p-name" placeholder="Fragrance Name">
                <input id="p-qty" placeholder="Quantity (e.g. 100 ml)">
                <input id="p-price" type="number" placeholder="Price (₹)">
                <input id="p-cat" placeholder="Category">
                <input id="p-img" placeholder="Image URL" style="grid-column: span 2;">
                <button class="action-btn" onclick="addExtrait()"><i class="fas fa-plus"></i> Add to Database</button>
            </div>
            <table class="data-table">
                <thead><tr><th>Name</th><th>Size/Qty</th><th>Category</th><th>Price</th><th>Action</th></tr></thead>
                <tbody id="products-list"></tbody>
            </table>
        </section>
    </main>

    <script>
        const API_URL = "https://shaan-perfume-backend.onrender.com";

        // Check auth on load
        window.onload = () => {
            if (localStorage.getItem("shaan_token")) {
                document.getElementById("auth-screen").style.display = "none";
                loadDashboardData();
            }
        };

        async function login() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem("shaan_token", data.token);
                    document.getElementById("auth-screen").style.display = "none";
                    loadDashboardData();
                } else { alert("Access Denied."); }
            } catch(e) { alert("Server offline or connecting..."); }
        }

        function logout() {
            localStorage.removeItem("shaan_token");
            window.location.reload();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('page-title').innerText = tabId === 'orders' ? 'Live Orders' : 'Inventory Management';
        }

        async function loadDashboardData() {
            const headers = { "Authorization": `Bearer ${localStorage.getItem("shaan_token")}` };
            
            // Load Stats
            fetch(`${API_URL}/stats`).then(r=>r.json()).then(stats => {
                document.getElementById("stat-rev").innerText = `₹${stats.totalRevenue.toLocaleString()}`;
                document.getElementById("stat-orders").innerText = stats.pendingOrders;
                document.getElementById("stat-prods").innerText = stats.totalProductsListed;
            });

            // Load Orders
            fetch(`${API_URL}/orders`, {headers}).then(r=>r.json()).then(data => {
                const list = document.getElementById("orders-list");
                list.innerHTML = data.map(o => `
                    <tr>
                        <td>${o.id}</td><td>${o.customer}</td><td style="font-size:0.8rem">${o.items}</td><td>₹${o.total}</td>
                        <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
                        <td>${o.status === 'Pending' ? `<button class="del-btn" style="background:var(--gold); color:black;" onclick="completeOrder('${o.id}')">Complete</button>` : 'Done'}</td>
                    </tr>
                `).join('');
            });

            // Load Products
            fetch(`${API_URL}/products`).then(r=>r.json()).then(data => {
                document.getElementById("products-list").innerHTML = data.map((p, i) => `
                    <tr>
                        <td><strong>${p.name}</strong></td><td style="color:var(--text-muted)">${p.quantity}</td>
                        <td><span class="badge" style="background:#333">${p.category}</span></td><td>₹${p.price}</td>
                        <td><button class="del-btn" onclick="deleteExtrait(${i})"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `).join('');
            });
        }

        async function completeOrder(id) {
            await fetch(`${API_URL}/orders/${id}`, {
                method: 'PATCH',
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${localStorage.getItem("shaan_token")}` },
                body: JSON.stringify({status: "Completed"})
            });
            loadDashboardData();
        }

        async function addExtrait() {
            const payload = {
                name: document.getElementById("p-name").value,
                quantity: document.getElementById("p-qty").value || "100 ml",
                price: document.getElementById("p-price").value,
                category: document.getElementById("p-cat").value || "Premium",
                img: document.getElementById("p-img").value || "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80"
            };
            await fetch(`${API_URL}/products`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${localStorage.getItem("shaan_token")}` },
                body: JSON.stringify(payload)
            });
            loadDashboardData();
        }

        async function deleteExtrait(index) {
            if(confirm("Delete this product?")) {
                await fetch(`${API_URL}/products/${index}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${localStorage.getItem("shaan_token")}` }
                });
                loadDashboardData();
            }
        }
    </script>
</body>
</html>
